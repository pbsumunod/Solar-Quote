name: Build Android APK

# Builds the debug APK on a real x86_64 Linux runner via Buildozer/python-for-android
# directly (no third-party wrapper action -- ArtemSBulgakov/buildozer-action's own
# Docker image build broke on a stale Ubuntu PPA it depends on). Kept separate from
# local (Mac) builds since Docker's x86_64-on-Apple-Silicon emulation doesn't support
# every syscall python-for-android's build needs -- GitHub's runners are genuinely
# x86_64 Linux, so none of that applies here.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "buildozer.spec"
      - "p4a_hooks.py"
      - "recipes/**"
      - "android_res/**"
      - "assets/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/test.yml
  build:
    needs: checks
    # Pinned to 22.04, not ubuntu-latest (24.04): 24.04's newer autoconf/libtool
    # is stricter about macro expansion than several p4a recipes' bundled,
    # long-unmaintained configure.ac scripts expect -- e.g. libffi's fails
    # autoreconf with "possibly undefined macro: LT_SYS_SYMBOL_USCORE" on 24.04.
    # 22.04 matches the toolchain these recipes actually build cleanly against.
    runs-on: ubuntu-22.04
    env:
      # The local fontTools source recipe disables optional Cython accelerators.
      # Retain this flag for any additional source installs; recursive artifact
      # verification also rejects host wheels inside the Python bundle.
      FONTTOOLS_WITH_CYTHON: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The Android Gradle plugin requires Java 17, but the runner's default
      # JAVA_HOME points at Java 11 -- setup-java both installs 17 and points
      # JAVA_HOME/PATH at it (apt-installing a second JDK alone doesn't).
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev cmake \
            libffi-dev libssl-dev automake build-essential

      - name: Install Buildozer
        run: pip install buildozer==1.5.0 Cython==3.0.12

      - name: Cache Buildozer global directory (SDK/NDK)
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-v2-${{ hashFiles('buildozer.spec', 'recipes/**', 'p4a_hooks.py', 'android_res/**', '.github/workflows/build*.yml') }}

      - name: Cache Buildozer project directory (compiled recipes)
        uses: actions/cache@v4
        with:
          path: .buildozer
          # v4: bumped to bust the previous cache, which had fontTools already
          # pip-installed with a bad x86_64-compiled bezierTools.so baked in
          # (see FONTTOOLS_WITH_CYTHON above) -- restore-keys would otherwise
          # keep restoring that stale install and skip reinstalling it.
          key: buildozer-v4-${{ hashFiles('buildozer.spec', 'recipes/**', 'p4a_hooks.py', 'android_res/**', '.github/workflows/build*.yml') }}-${{ github.sha }}
          restore-keys: |
            buildozer-v4-${{ hashFiles('buildozer.spec', 'recipes/**', 'p4a_hooks.py', 'android_res/**', '.github/workflows/build*.yml') }}-

      - name: Build APK
        env:
          # See build-release-aab.yml's identical env var (and
          # recipes/python3's override) for why -- same recipe, same risk
          # here whenever buildozer.spec changes force a fresh python3
          # rebuild.
          CFLAGS: "-D_DEFAULT_SOURCE"
        run: yes | buildozer android debug

      - name: Check native architecture and 16 KB ELF alignment
        run: |
          APK_FILE=$(find bin -name "*.apk" | head -n1)
          python scripts/check_android_artifact.py "$APK_FILE"
          ZIPALIGN=$(find "$HOME/.buildozer" -path '*/build-tools/36.0.0/zipalign' -print -quit)
          test -n "$ZIPALIGN"
          "$ZIPALIGN" -c -P 16 -v 4 "$APK_FILE"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: solarquote-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          # Artifacts count against an ACCOUNT-WIDE Actions storage quota,
          # not a per-repo one. Left at the 90-day default these built up to
          # ~2.4 GB here and exhausted the shared 500 MB allowance, which
          # then failed builds in a DIFFERENT repository at the upload step,
          # long after their packages had compiled successfully -- a failure
          # that reads as a broken build with nothing wrong with the code.
          # A debug APK is a hand-off: downloaded, installed, superseded by
          # the next build. Three days is far more than it is ever needed for.
          retention-days: 3
