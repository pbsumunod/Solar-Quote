name: Build Android APK

# Builds the debug APK on a real x86_64 Linux runner via Buildozer/python-for-android
# directly (no third-party wrapper action -- ArtemSBulgakov/buildozer-action's own
# Docker image build broke on a stale Ubuntu PPA it depends on). Kept separate from
# local (Mac) builds since Docker's x86_64-on-Apple-Silicon emulation doesn't support
# every syscall python-for-android's build needs -- GitHub's runners are genuinely
# x86_64 Linux, so none of that applies here.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "buildozer.spec"
      - "p4a_hooks.py"
      - "recipes/**"
      - "android_res/**"
      - "assets/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    # Pinned to 22.04, not ubuntu-latest (24.04): 24.04's newer autoconf/libtool
    # is stricter about macro expansion than several p4a recipes' bundled,
    # long-unmaintained configure.ac scripts expect -- e.g. libffi's fails
    # autoreconf with "possibly undefined macro: LT_SYS_SYMBOL_USCORE" on 24.04.
    # 22.04 matches the toolchain these recipes actually build cleanly against.
    runs-on: ubuntu-22.04
    env:
      # fonttools (a plain pip requirement with no p4a recipe, so it's installed
      # by running its own setup.py on the x86_64 build host) auto-builds a
      # compiled Cython accelerator for fontTools.misc.bezierTools whenever
      # Cython is importable -- which it is here, since Kivy's own recipe needs
      # the "cython" package installed on the host to cythonize its .pyx
      # sources before cross-compiling. That leaves an x86_64 bezierTools.so
      # bundled straight into the arm64-v8a APK, which then fails on-device
      # with "dlopen failed: ... is for EM_X86_64 (62) instead of EM_AARCH64
      # (183)". fontTools' setup.py reads this env var to force the pure-Python
      # build instead of auto-detecting Cython -- see its `env_with_cython`
      # check -- without touching Kivy's own (separate) cythonizing step.
      FONTTOOLS_WITH_CYTHON: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The Android Gradle plugin requires Java 17, but the runner's default
      # JAVA_HOME points at Java 11 -- setup-java both installs 17 and points
      # JAVA_HOME/PATH at it (apt-installing a second JDK alone doesn't).
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev cmake \
            libffi-dev libssl-dev automake build-essential

      - name: Install Buildozer
        run: pip install --upgrade buildozer cython

      - name: Cache Buildozer global directory (SDK/NDK)
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}

      - name: Cache Buildozer project directory (compiled recipes)
        uses: actions/cache@v4
        with:
          path: .buildozer
          # v2: bumped to bust the previous cache, which had fontTools already
          # pip-installed with a bad x86_64-compiled bezierTools.so baked in
          # (see FONTTOOLS_WITH_CYTHON above) -- restore-keys would otherwise
          # keep restoring that stale install and skip reinstalling it.
          key: buildozer-v2-${{ hashFiles('buildozer.spec') }}-${{ github.sha }}
          restore-keys: |
            buildozer-v2-${{ hashFiles('buildozer.spec') }}-

      - name: Build APK
        run: yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: solarquote-debug-apk
          path: bin/*.apk
          if-no-files-found: error
