name: Build Signed Release AAB

# Builds a signed Android App Bundle (.aab) for uploading to Play Console
# (Internal Testing and beyond) -- Play requires .aab for new apps, not the
# .apk that build-apk.yml produces for direct-install debug testing.
#
# Manually triggered only (workflow_dispatch), not on every push: a release
# build is a deliberate act tied to actually shipping a version, not
# something that should fire on every commit the way the debug build does.
#
# Signing: buildozer/python-for-android read the release keystore from four
# P4A_RELEASE_* environment variables (see buildozer's own docs on automated
# release signing) rather than any buildozer.spec field -- if a future
# buildozer/p4a version changes this, a release build failing to produce a
# *signed* .aab (check with `jarsigner -verify`) is the symptom to look for.
#
# The keystore itself is never committed -- it's stored as a base64-encoded
# GitHub Actions secret (ANDROID_KEYSTORE_BASE64) and decoded to $RUNNER_TEMP
# (outside the repo checkout) only for the duration of this job; the runner
# is destroyed afterward.

on:
  workflow_dispatch:

jobs:
  build:
    # Same toolchain as build-apk.yml -- see that file's comments for why
    # 22.04 specifically, and why FONTTOOLS_WITH_CYTHON is needed.
    runs-on: ubuntu-22.04
    env:
      FONTTOOLS_WITH_CYTHON: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev cmake \
            libffi-dev libssl-dev automake build-essential

      - name: Install Buildozer
        run: pip install --upgrade buildozer cython

      - name: Cache Buildozer global directory (SDK/NDK)
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}

      - name: Cache Buildozer project directory (compiled recipes)
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-release-v1-${{ hashFiles('buildozer.spec') }}-${{ github.sha }}
          restore-keys: |
            buildozer-release-v1-${{ hashFiles('buildozer.spec') }}-

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set -- see the release-build setup instructions."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Build signed AAB
        env:
          P4A_RELEASE_KEYSTORE: ${{ runner.temp }}/release.keystore
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: yes | buildozer android release

      - name: Verify the AAB is actually signed
        run: |
          AAB_FILE=$(find bin -name "*.aab" | head -n1)
          if [ -z "$AAB_FILE" ]; then
            echo "::error::No .aab found in bin/ -- build did not produce a bundle."
            exit 1
          fi
          jarsigner -verify "$AAB_FILE" || {
            echo "::error::$AAB_FILE is not signed -- check the P4A_RELEASE_* secrets."
            exit 1
          }
          echo "Signed bundle: $AAB_FILE"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: solarquote-release-aab
          path: bin/*.aab
          if-no-files-found: error
