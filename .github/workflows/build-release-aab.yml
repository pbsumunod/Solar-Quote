name: Build Signed Release AAB

# Builds a signed Android App Bundle (.aab) for uploading to Play Console
# (Internal Testing and beyond) -- Play requires .aab for new apps, not the
# .apk that build-apk.yml produces for direct-install debug testing.
#
# Manually triggered only (workflow_dispatch), not on every push: a release
# build is a deliberate act tied to actually shipping a version, not
# something that should fire on every commit the way the debug build does.
#
# Signing: buildozer/python-for-android read the release keystore from four
# P4A_RELEASE_* environment variables (see buildozer's own docs on automated
# release signing) rather than any buildozer.spec field -- if a future
# buildozer/p4a version changes this, a release build failing to produce a
# *signed* .aab (check with `jarsigner -verify`) is the symptom to look for.
#
# The keystore itself is never committed -- it's stored as a base64-encoded
# GitHub Actions secret (ANDROID_KEYSTORE_BASE64) and decoded to $RUNNER_TEMP
# (outside the repo checkout) only for the duration of this job; the runner
# is destroyed afterward.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/test.yml
  build:
    needs: checks
    # Same toolchain as build-apk.yml -- see that file's comments for why
    # 22.04 specifically, and why FONTTOOLS_WITH_CYTHON is needed.
    runs-on: ubuntu-22.04
    env:
      FONTTOOLS_WITH_CYTHON: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev cmake \
            libffi-dev libssl-dev automake build-essential

      - name: Install Buildozer
        run: pip install buildozer==1.5.0 Cython==3.0.12

      - name: Cache Buildozer global directory (SDK/NDK)
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-v2-${{ hashFiles('buildozer.spec', 'recipes/**', 'p4a_hooks.py', 'android_res/**', '.github/workflows/build*.yml') }}

      - name: Cache Buildozer project directory (compiled recipes)
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-release-v1-${{ hashFiles('buildozer.spec', 'recipes/**', 'p4a_hooks.py', 'android_res/**', '.github/workflows/build*.yml') }}-${{ github.sha }}
          restore-keys: |
            buildozer-release-v1-${{ hashFiles('buildozer.spec', 'recipes/**', 'p4a_hooks.py', 'android_res/**', '.github/workflows/build*.yml') }}-

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set -- see the release-build setup instructions."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Build signed AAB
        env:
          P4A_RELEASE_KEYSTORE: ${{ runner.temp }}/release.keystore
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # CPython 3.11.9's own Modules/grpmodule.c calls setgrent()/
          # getgrent()/endgrent(), which aren't declared under strict
          # -std=c11 without this glibc feature-test macro exposed --
          # CPython's configure forces -Werror=implicit-function-declaration
          # as its own hardening check, turning that into a hard build
          # failure. A -Wno-error=... flag here does NOT fix it: configure
          # appends its own -Werror flag *after* whatever CFLAGS supplies,
          # and flag order decides for competing GCC/Clang -W-family flags
          # on the same warning, so configure's flag wins regardless. Only
          # covers hostpython3's host-side build -- recipes/python3's own
          # get_recipe_env() overwrites CFLAGS outright for the actual
          # NDK-cross-compiled target build and needed a separate fix there.
          CFLAGS: "-D_DEFAULT_SOURCE"
        run: yes | buildozer android release

      - name: Verify expected signer and reject unsigned entries
        env:
          VERIFY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERIFY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          AAB_FILE=$(find bin -name "*.aab" | head -n1)
          if [ -z "$AAB_FILE" ]; then
            echo "::error::No .aab found in bin/ -- build did not produce a bundle."
            exit 1
          fi
          jarsigner -verify -strict -keystore "$RUNNER_TEMP/release.keystore" -storepass:env VERIFY_KEYSTORE_PASSWORD "$AAB_FILE" "$VERIFY_KEY_ALIAS" || {
            echo "::error::$AAB_FILE is not signed -- check the P4A_RELEASE_* secrets."
            exit 1
          }
          echo "Signed bundle: $AAB_FILE"

      - name: Check native architecture and 16 KB ELF alignment
        run: |
          AAB_FILE=$(find bin -name "*.aab" | head -n1)
          python scripts/check_android_artifact.py "$AAB_FILE"

      - name: Verify generated APK ZIP alignment
        run: |
          BUNDLETOOL="$RUNNER_TEMP/bundletool.jar"
          curl -fsSL --retry 3 https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar -o "$BUNDLETOOL"
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $BUNDLETOOL" | sha256sum -c -
          AAB_FILE=$(find bin -name "*.aab" | head -n1)
          # Disposable local key signs only the APK used for alignment checks.
          keytool -genkeypair -keystore "$RUNNER_TEMP/check.keystore" -storepass android -keypass android -alias androiddebugkey -dname "CN=Alignment Check" -keyalg RSA -keysize 2048 -validity 1
          java -jar "$BUNDLETOOL" build-apks --bundle="$AAB_FILE" --output="$RUNNER_TEMP/check.apks" --mode=universal --ks="$RUNNER_TEMP/check.keystore" --ks-key-alias=androiddebugkey --ks-pass=pass:android --key-pass=pass:android
          unzip -p "$RUNNER_TEMP/check.apks" universal.apk > "$RUNNER_TEMP/check.apk"
          ZIPALIGN=$(find "$HOME/.buildozer" -path '*/build-tools/36.0.0/zipalign' -print -quit)
          test -n "$ZIPALIGN"
          "$ZIPALIGN" -c -P 16 -v 4 "$RUNNER_TEMP/check.apk"

      - name: Collect matching unstripped native symbols
        run: |
          AAB_FILE=$(find bin -name "*.aab" | head -n1)
          READELF=$(find "$HOME/.buildozer" -path '*llvm/prebuilt/linux-x86_64/bin/llvm-readelf' -print -quit)
          test -n "$READELF"
          python scripts/create_native_symbols.py "$AAB_FILE" .buildozer "$RUNNER_TEMP/native-debug-symbols" --readelf "$READELF"

      - name: Upload native debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: solarquote-native-debug-symbols
          # GitHub packages this directory as a ZIP whose top-level entry is
          # arm64-v8a/, which is the layout Play Console expects directly.
          path: ${{ runner.temp }}/native-debug-symbols
          if-no-files-found: error
          retention-days: 14

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: solarquote-release-aab
          path: bin/*.aab
          if-no-files-found: error
          # Artifacts count against an ACCOUNT-WIDE Actions storage quota,
          # not a per-repo one. Left at the 90-day default these built up to
          # ~2.4 GB here and exhausted the shared 500 MB allowance, which
          # then failed builds in a DIFFERENT repository at the upload step,
          # long after their packages had compiled successfully -- a failure
          # that reads as a broken build with nothing wrong with the code.
          # A release AAB is kept longer than the debug APK -- it is what gets
          # uploaded to Play Console, so it is worth being able to re-fetch a
          # recent one without rebuilding.
          retention-days: 14
